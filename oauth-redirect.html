<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040136">
<title>EMDR — Authorization</title>
<style>
  html,body{height:100%;margin:0}
  body{
    background:#040136;color:#eef0ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:340px;padding:32px 24px}
  .check{
    width:56px;height:56px;border-radius:50%;
    background:rgba(120,200,160,.15);border:2px solid #6fcf97;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
    font-size:28px;color:#6fcf97;
  }
  h1{font-size:18px;font-weight:600;margin:0 0 8px}
  p{font-size:14px;line-height:1.5;color:#aab0d6;margin:0}
  .hint{margin-top:16px;font-size:12px;color:#7780db}
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Authorization complete</h1>
    <p>EMDR is connected to Zoom. You can close this window and return to your meeting.</p>
    <p class="hint" id="hint"></p>
  </div>
<script>
  // Zoom in-client OAuth: this page is the redirect target. The app itself runs
  // fully in-client via the Zoom Apps SDK and needs no token exchange here.
  // Best effort: notify any opener and close the popup window.
  (function () {
    try {
      var params = new URLSearchParams(window.location.search);
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage({ source: "emdr-oauth", ok: !params.get("error") }, "*"); } catch (e) {}
      }
      // Close the popup shortly after; if it cannot close, leave the confirmation visible.
      setTimeout(function () {
        try { window.close(); } catch (e) {}
        var h = document.getElementById("hint");
        if (h) h.textContent = "If this window did not close automatically, you can close it manually.";
      }, 800);
    } catch (e) {}
  })();
</script>
</body>
</html>
